# Reference only — documents the required keys for the `app-secrets` Secret.
# DO NOT `kubectl apply` this file. Real values are generated by scripts/setup.sh
# (random RabbitMQ/Redis passwords, never committed) and created directly with
# `kubectl create secret generic`.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: takehome
type: Opaque
stringData:
  RABBITMQ_USER: "takehome"
  RABBITMQ_PASSWORD: "GENERATE_ME"
  REDIS_PASSWORD: "GENERATE_ME"
  RABBITMQ_URL: "amqp://takehome:GENERATE_ME@rabbitmq.takehome.svc.cluster.local:5672/"
  REDIS_URL: "redis://:GENERATE_ME@redis.takehome.svc.cluster.local:6379/0"
